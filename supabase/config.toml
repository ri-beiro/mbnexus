project_id = "mbnexus"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Microsoft Entra ID OAuth (fase 8) — client secret via env, nunca aqui.
[auth.external.azure]
enabled = false
client_id = "env(MS_CLIENT_ID)"
secret = "env(MS_CLIENT_SECRET)"
url = "env(MS_TENANT_ID)" # https://login.microsoftonline.com/<MS_TENANT_ID>/v2.0

[storage]
enabled = true

[edge_runtime]
enabled = true
